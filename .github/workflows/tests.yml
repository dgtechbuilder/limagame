name: Tests

# Type-check, build and the Playwright play-tests, on every pull request (the deploy workflow is separate).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        # the system packages come from Ubuntu's mirrors, which sometimes fail to resolve: try three times
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install failed (try $i of 3)"; sleep 20
          done
          exit 1
      - name: Play-tests
        run: npm test
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
