name: Live check (temporary)
on:
  push:
    branches: [wakala-shots-tmp]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for the published build
        run: |
          for i in $(seq 1 40); do
            curl -s https://dgtechbuilder.github.io/limagame/sw.js | grep -q "lima-v1" && break
            sleep 15
          done
      - run: npx playwright test tests/perf.spec.ts --retries 0 --reporter=list
        env:
          LIMA_URL: https://dgtechbuilder.github.io/limagame/
