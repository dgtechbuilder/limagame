name: Tour screenshots (temporary)
on:
  push:
    branches: [wakala-shots-tmp]
permissions:
  contents: read
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/tour.spec.ts --retries 0
      - name: Print the screenshots
        if: ${{ !cancelled() }}
        run: |
          ls -la test-results/tour
          for f in test-results/tour/*.png; do
            echo "IMG $(basename "${f%.png}") $(base64 -w0 "$f")"
          done
